<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>__TITLE__</title>
		<meta name="description" content="__DESCRIPTION__" />
		<meta property="og:title" content="__TITLE__" />
		<meta property="og:description" content="__DESCRIPTION__" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="__URL__" />
		<meta property="og:image" content="__ICON__" />
		<meta name="twitter:card" content="summary" />
		<meta name="theme-color" content="#ffffff" />
		<link rel="icon" href="__ICON__" />
		<link rel="canonical" href="__URL__" />
		<link rel="alternate" type="application/rss+xml" title="__TITLE__" href="__URL__/rss.xml" />
		<script>
			(function(){var t=localStorage.getItem('pref-theme');if(!t)t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;if(t==='dark'){document.documentElement.classList.add('dark');var m=document.querySelector('meta[name="theme-color"]');if(m)m.content='#1d1e20'}})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
